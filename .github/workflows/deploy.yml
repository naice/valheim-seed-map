name: Pages & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Website zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html favicon.ico robots.txt sitemap.xml css js data lang poi-icons \
            de fr it pt es no sv nl seeds bosses traders faq _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: ZIP für das Release
        run: cd _site && zip -r ../valheim-seed-map.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: valheim-seed-map.zip

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.${{ github.run_number }}
        run: >
          gh release create "$TAG" valheim-seed-map.zip
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "$TAG"
          --generate-notes

  # Nach dem Release denselben Stand ins Plesk-Git von valheim-map.de schieben.
  # Zugangsdaten: Repository-Secrets PLESK_GIT_URL / _USER / _PASSWORD (lokal in .env, siehe README).
  plesk:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLESK_GIT_URL: ${{ secrets.PLESK_GIT_URL }}
      PLESK_GIT_USER: ${{ secrets.PLESK_GIT_USER }}
      PLESK_GIT_PASSWORD: ${{ secrets.PLESK_GIT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Nach Plesk pushen
        run: |
          if [ -z "$PLESK_GIT_URL" ] || [ -z "$PLESK_GIT_USER" ] || [ -z "$PLESK_GIT_PASSWORD" ]; then
            echo "::warning::Plesk-Secrets fehlen – Push übersprungen."
            exit 0
          fi
          AUTH=$(printf '%s:%s' "$PLESK_GIT_USER" "$PLESK_GIT_PASSWORD" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.extraheader="Authorization: Basic $AUTH" push "$PLESK_GIT_URL" HEAD:refs/heads/main
