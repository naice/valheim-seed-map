<body class="map-page">
  <header class="site-head">
    <h1><a class="brand" href="../no/"><img src="../poi-icons/site/favicon-32.png" alt="" width="24" height="24"> Valheim-Map</a></h1>
    <nav>
        <a href="../no/" aria-current="page">Kart</a>
        <a href="../no/seeds/">Beste seeds</a>
        <a href="../no/bosses/">Bosser</a>
        <a href="../no/traders/">Kremmere</a>
        <a href="../no/faq/">FAQ</a>
    </nav>
    <div class="tools"><a id="btnDonate" class="tool" href="https://ko-fi.com/emmuss" target="_blank" rel="noopener" title="Støtt prosjektet på Ko-fi"><span class="heart">♥</span> Doner</a><button id="btnLang" class="tool" type="button" title="Velg språk" aria-haspopup="dialog">🌐 Norsk</button></div>
  </header>
  <div id="app">
    <aside id="sidebar">

      <section>
        <h2>Verden</h2>
        <form id="seedForm" class="row">
          <input id="seedInput" type="text" placeholder="Seed, f.eks. Xldpp3L2LG" spellcheck="false" autocomplete="off">
          <button type="submit">Last inn</button>
        </form>
        <div class="row">
          <input id="nameInput" type="text" placeholder="Navn (valgfritt)" spellcheck="false" autocomplete="off" maxlength="60">
          <button id="btnSave" type="button" title="Lagre seeden (og navnet) i denne nettleseren">Lagre</button>
        </div>
        <div class="row">
          <div id="saved" class="dropdown">
            <button id="savedBtn" type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"></button>
            <ul id="savedList" class="dd-list" role="listbox" hidden></ul>
          </div>
          <button id="btnExample" type="button" title="Last inn eksempel-seeden Xldpp3L2LG">Eksempelverden</button>
        </div>
        <p id="worldInfo" class="info"></p>
      </section>

      <section class="grow">
        <h2>Steder (POI-er) <span id="poiTotal" class="muted"></span></h2>
        <div class="row">
          <input id="search" type="search" placeholder="Søk, f.eks. handelsmann, krypt…">
        </div>
        <div class="row small">
          <button id="btnAll" type="button">Alle</button>
          <button id="btnNone" type="button">Ingen</button>
          <label><input id="chkLabels" type="checkbox" checked> Navn</label>
        </div>
        <div id="cats"></div>
        <p id="poiHint" class="info"></p>
      </section>

      <footer>
        <span>Dra = flytt · Musehjul = zoom · Klikk på et navn i listen for å hoppe til nærmeste sted</span>
      </footer>
    </aside>

    <main id="mapWrap">
      <canvas id="map"></canvas>
      <div id="tooltip" hidden></div>
      <div id="popup" hidden></div>
      <div id="progress" role="progressbar" aria-label="Beregner steder …" aria-valuemin="0" aria-valuemax="100" hidden>
        <div class="progress-head"><span>Beregner steder …</span><span id="progressText">0 %</span></div>
        <div class="progress-track"><div id="progressBar"></div></div>
      </div>
      <div id="zoomBtns">
        <button id="zoomIn" type="button" title="Zoom inn">+</button>
        <button id="zoomOut" type="button" title="Zoom ut">−</button>
        <button id="zoomHome" type="button" title="Hele verden">⌂</button>
      </div>
      <div id="status">
        <span id="stPos">–</span>
        <span id="stBiome"></span>
        <span id="stScale"></span>
        <span id="stLoad"></span>
      </div>
    </main>
  </div>

  <noscript><p class="noscript">Det interaktive kartet trenger JavaScript. Guidene for seeds, bosser og kremmere fungerer uten.</p></noscript>

  <dialog id="langDlg" aria-labelledby="langHead">
    <button id="langClose" type="button" class="close" title="Lukk">×</button>
    <h3 id="langHead">Velg språk</h3>
    <div id="langList"></div>
  </dialog>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
