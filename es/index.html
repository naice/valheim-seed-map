<body class="map-page">
  <header class="site-head">
    <h1><a class="brand" href="../es/"><img src="../poi-icons/site/favicon-32.png" alt="" width="24" height="24"> Valheim-Map</a></h1>
    <nav>
        <a href="../es/" aria-current="page">Mapa</a>
        <a href="../es/seeds/">Mejores semillas</a>
        <a href="../es/bosses/">Jefes</a>
        <a href="../es/traders/">Comerciantes</a>
        <a href="../es/faq/">FAQ</a>
    </nav>
    <div class="tools"><a id="btnDonate" class="tool" href="https://ko-fi.com/emmuss" target="_blank" rel="noopener" title="Apoyar el proyecto en Ko-fi"><span class="heart">♥</span> Donar</a><button id="btnLang" class="tool" type="button" title="Elegir idioma" aria-haspopup="dialog">🌐 Español</button></div>
  </header>
  <div id="app">
    <aside id="sidebar">

      <section>
        <h2>Mundo</h2>
        <form id="seedForm" class="row">
          <input id="seedInput" type="text" placeholder="Semilla, p. ej. Xldpp3L2LG" spellcheck="false" autocomplete="off">
          <button type="submit">Cargar</button>
        </form>
        <div class="row">
          <input id="nameInput" type="text" placeholder="Nombre (opcional)" spellcheck="false" autocomplete="off" maxlength="60">
          <button id="btnSave" type="button" title="Guardar la semilla (y el nombre) en este navegador">Guardar</button>
        </div>
        <div class="row">
          <div id="saved" class="dropdown">
            <button id="savedBtn" type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"></button>
            <ul id="savedList" class="dd-list" role="listbox" hidden></ul>
          </div>
          <button id="btnExample" type="button" title="Cargar la semilla de ejemplo Xldpp3L2LG">Mundo de ejemplo</button>
        </div>
        <p id="worldInfo" class="info"></p>
      </section>

      <section class="grow">
        <h2>Lugares (PDI) <span id="poiTotal" class="muted"></span></h2>
        <div class="row">
          <input id="search" type="search" placeholder="Buscar, p. ej. mercader, cripta…">
        </div>
        <div class="row small">
          <button id="btnAll" type="button">Todos</button>
          <button id="btnNone" type="button">Ninguno</button>
          <label><input id="chkLabels" type="checkbox" checked> Nombres</label>
        </div>
        <div id="cats"></div>
        <p id="poiHint" class="info"></p>
      </section>

      <footer>
        <span>Arrastrar = mover · Rueda del ratón = zoom · Haz clic en un nombre de la lista para ir al lugar más cercano</span>
      </footer>
    </aside>

    <main id="mapWrap">
      <canvas id="map"></canvas>
      <div id="tooltip" hidden></div>
      <div id="popup" hidden></div>
      <div id="progress" role="progressbar" aria-label="Calculando los lugares …" aria-valuemin="0" aria-valuemax="100" hidden>
        <div class="progress-head"><span>Calculando los lugares …</span><span id="progressText">0 %</span></div>
        <div class="progress-track"><div id="progressBar"></div></div>
      </div>
      <div id="zoomBtns">
        <button id="zoomIn" type="button" title="Acercar">+</button>
        <button id="zoomOut" type="button" title="Alejar">−</button>
        <button id="zoomHome" type="button" title="Mundo entero">⌂</button>
      </div>
      <div id="status">
        <span id="stPos">–</span>
        <span id="stBiome"></span>
        <span id="stScale"></span>
        <span id="stLoad"></span>
      </div>
    </main>
  </div>

  <noscript><p class="noscript">El mapa interactivo necesita JavaScript. Las guías de semillas, jefes y comerciantes funcionan sin él.</p></noscript>

  <dialog id="langDlg" aria-labelledby="langHead">
    <button id="langClose" type="button" class="close" title="Cerrar">×</button>
    <h3 id="langHead">Elegir idioma</h3>
    <div id="langList"></div>
  </dialog>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
