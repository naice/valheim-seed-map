<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valheim Seed-Karte</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>Valheim Seed-Karte</h1>
      <p class="sub">Ganze Welt ohne Nebel – direkt aus dem Seed berechnet</p>
    </header>

    <section>
      <h2>Welt</h2>
      <form id="seedForm" class="row">
        <input id="seedInput" type="text" placeholder="Seed, z. B. Xldpp3L2LG" spellcheck="false" autocomplete="off">
        <button type="submit">Laden</button>
      </form>
      <div class="row">
        <button id="btnBundled" type="button" title="Mitgelieferte Welt inkl. aller POIs laden">BjoernoutV1</button>
        <button id="btnImport" type="button" title="*.fwl2 und *.db2 aus dem Valheim-Weltenordner auswählen">Spielstand importieren…</button>
        <input id="fileInput" type="file" multiple accept=".fwl,.fwl2,.db2" hidden>
      </div>
      <p id="worldInfo" class="info"></p>
    </section>

    <section class="grow">
      <h2>Orte (POIs) <span id="poiTotal" class="muted"></span></h2>
      <div class="row">
        <input id="search" type="search" placeholder="Suchen, z. B. Händler, Krypta…">
      </div>
      <div class="row small">
        <button id="btnAll" type="button">Alle</button>
        <button id="btnNone" type="button">Keine</button>
        <label><input id="chkLabels" type="checkbox" checked> Namen</label>
        <label title="Nur Orte zeigen, deren Zone noch nicht besucht wurde"><input id="chkUnvisited" type="checkbox"> nur unbesucht</label>
      </div>
      <div id="cats"></div>
      <p id="poiHint" class="info"></p>
    </section>

    <footer>
      Ziehen = verschieben · Mausrad = zoomen · Klick auf einen Namen in der Liste springt zum nächsten Ort
    </footer>
  </aside>

  <main id="mapWrap">
    <canvas id="map"></canvas>
    <div id="tooltip" hidden></div>
    <div id="popup" hidden></div>
    <div id="zoomBtns">
      <button id="zoomIn" type="button" title="Hineinzoomen">+</button>
      <button id="zoomOut" type="button" title="Herauszoomen">−</button>
      <button id="zoomHome" type="button" title="Ganze Welt">⌂</button>
    </div>
    <div id="status">
      <span id="stPos">–</span>
      <span id="stBiome"></span>
      <span id="stScale"></span>
      <span id="stLoad"></span>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
