<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valheim-Map</title>
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="poi-icons/site/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="poi-icons/site/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="poi-icons/site/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1 data-i18n="title">Valheim-Map</h1>
      <p class="sub" data-i18n="sub">Ganze Welt ohne Nebel – direkt aus dem Seed berechnet</p>
    </header>

    <section>
      <h2 data-i18n="world">Welt</h2>
      <form id="seedForm" class="row">
        <input id="seedInput" type="text" placeholder="Seed, z. B. Xldpp3L2LG" data-i18n-placeholder="seedPh" spellcheck="false" autocomplete="off">
        <button type="submit" data-i18n="load">Laden</button>
      </form>
      <div class="row">
        <input id="nameInput" type="text" placeholder="Name (optional)" data-i18n-placeholder="namePh" spellcheck="false" autocomplete="off" maxlength="60">
        <button id="btnSave" type="button" title="Seed (und Namen) in diesem Browser speichern" data-i18n="save" data-i18n-title="saveTitle">Speichern</button>
      </div>
      <div class="row">
        <div id="saved" class="dropdown">
          <button id="savedBtn" type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"></button>
          <ul id="savedList" class="dd-list" role="listbox" hidden></ul>
        </div>
        <button id="btnExample" type="button" title="Beispiel-Seed Xldpp3L2LG laden" data-i18n="example" data-i18n-title="exampleTitle">Beispielwelt</button>
      </div>
      <p id="worldInfo" class="info"></p>
    </section>

    <section class="grow">
      <h2><span data-i18n="pois">Orte (POIs)</span> <span id="poiTotal" class="muted"></span></h2>
      <div class="row">
        <input id="search" type="search" placeholder="Suchen, z. B. Händler, Krypta…" data-i18n-placeholder="searchPh">
      </div>
      <div class="row small">
        <button id="btnAll" type="button" data-i18n="all">Alle</button>
        <button id="btnNone" type="button" data-i18n="none">Keine</button>
        <label><input id="chkLabels" type="checkbox" checked> <span data-i18n="names">Namen</span></label>
      </div>
      <div id="cats"></div>
      <p id="poiHint" class="info"></p>
    </section>

    <footer>
      <span data-i18n="footer">Ziehen = verschieben · Mausrad = zoomen · Klick auf einen Namen in der Liste springt zum nächsten Ort</span>
      <a id="btnDonate" class="btn" href="https://ko-fi.com/emmuss" target="_blank" rel="noopener" title="Das Projekt auf Ko-fi unterstützen" data-i18n-title="donateTitle"><span class="heart">♥</span> <span data-i18n="donate">Spenden</span></a>
      <button id="btnLang" type="button" title="Sprache wählen" data-i18n-title="langTitle" aria-haspopup="dialog">🌐 Deutsch</button>
    </footer>
  </aside>

  <main id="mapWrap">
    <canvas id="map"></canvas>
    <div id="tooltip" hidden></div>
    <div id="popup" hidden></div>
    <div id="progress" role="progressbar" aria-label="Orte werden berechnet" data-i18n-aria-label="computing" aria-valuemin="0" aria-valuemax="100" hidden>
      <div class="progress-head"><span data-i18n="computing">Orte werden berechnet …</span><span id="progressText">0 %</span></div>
      <div class="progress-track"><div id="progressBar"></div></div>
    </div>
    <div id="zoomBtns">
      <button id="zoomIn" type="button" title="Hineinzoomen" data-i18n-title="zoomIn">+</button>
      <button id="zoomOut" type="button" title="Herauszoomen" data-i18n-title="zoomOut">−</button>
      <button id="zoomHome" type="button" title="Ganze Welt" data-i18n-title="zoomHome">⌂</button>
    </div>
    <div id="status">
      <span id="stPos">–</span>
      <span id="stBiome"></span>
      <span id="stScale"></span>
      <span id="stLoad"></span>
    </div>
  </main>

  <dialog id="langDlg" aria-labelledby="langHead">
    <button id="langClose" type="button" class="close" title="Schließen" data-i18n-title="close">×</button>
    <h3 id="langHead" data-i18n="langTitle">Sprache wählen</h3>
    <div id="langList"></div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
