<body>
  <aside id="sidebar">
    <header>
      <h1 data-i18n="title">Valheim-Map</h1>
      <p class="sub" data-i18n="sub">The whole world without fog – computed straight from the seed</p>
    </header>

    <section>
      <h2 data-i18n="world">World</h2>
      <form id="seedForm" class="row">
        <input id="seedInput" type="text" placeholder="Seed, e.g. Xldpp3L2LG" data-i18n-placeholder="seedPh" spellcheck="false" autocomplete="off">
        <button type="submit" data-i18n="load">Load</button>
      </form>
      <div class="row">
        <input id="nameInput" type="text" placeholder="Name (optional)" data-i18n-placeholder="namePh" spellcheck="false" autocomplete="off" maxlength="60">
        <button id="btnSave" type="button" title="Save the seed (and name) in this browser" data-i18n="save" data-i18n-title="saveTitle">Save</button>
      </div>
      <div class="row">
        <div id="saved" class="dropdown">
          <button id="savedBtn" type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"></button>
          <ul id="savedList" class="dd-list" role="listbox" hidden></ul>
        </div>
        <button id="btnExample" type="button" title="Load the example seed Xldpp3L2LG" data-i18n="example" data-i18n-title="exampleTitle">Example world</button>
      </div>
      <p id="worldInfo" class="info"></p>
    </section>

    <section class="grow">
      <h2><span data-i18n="pois">Locations (POIs)</span> <span id="poiTotal" class="muted"></span></h2>
      <div class="row">
        <input id="search" type="search" placeholder="Search, e.g. trader, crypt…" data-i18n-placeholder="searchPh">
      </div>
      <div class="row small">
        <button id="btnAll" type="button" data-i18n="all">All</button>
        <button id="btnNone" type="button" data-i18n="none">None</button>
        <label><input id="chkLabels" type="checkbox" checked> <span data-i18n="names">Names</span></label>
      </div>
      <div id="cats"></div>
      <p id="poiHint" class="info"></p>
    </section>

    <footer>
      <span data-i18n="footer">Drag = pan · Mouse wheel = zoom · Click a name in the list to jump to the nearest location</span>
      <a id="btnDonate" class="btn" href="https://ko-fi.com/emmuss" target="_blank" rel="noopener" title="Support the project on Ko-fi" data-i18n-title="donateTitle"><span class="heart">♥</span> <span data-i18n="donate">Donate</span></a>
      <button id="btnLang" type="button" title="Choose language" data-i18n-title="langTitle" aria-haspopup="dialog">🌐 English</button>
    </footer>
  </aside>

  <main id="mapWrap">
    <canvas id="map"></canvas>
    <div id="tooltip" hidden></div>
    <div id="popup" hidden></div>
    <div id="progress" role="progressbar" aria-label="Computing locations …" data-i18n-aria-label="computing" aria-valuemin="0" aria-valuemax="100" hidden>
      <div class="progress-head"><span data-i18n="computing">Computing locations …</span><span id="progressText">0 %</span></div>
      <div class="progress-track"><div id="progressBar"></div></div>
    </div>
    <div id="zoomBtns">
      <button id="zoomIn" type="button" title="Zoom in" data-i18n-title="zoomIn">+</button>
      <button id="zoomOut" type="button" title="Zoom out" data-i18n-title="zoomOut">−</button>
      <button id="zoomHome" type="button" title="Whole world" data-i18n-title="zoomHome">⌂</button>
    </div>
    <div id="status">
      <span id="stPos">–</span>
      <span id="stBiome"></span>
      <span id="stScale"></span>
      <span id="stLoad"></span>
    </div>
  </main>

  <noscript>
    <p style="padding:16px">Free interactive Valheim map: enter any world seed and see the whole world without fog – bosses, traders (Haldor, Hildir, Bog Witch), dungeons, crypts, tar pits and 90+ other location types. Runs entirely in your browser. JavaScript is required to render the map.</p>
  </noscript>

  <dialog id="langDlg" aria-labelledby="langHead">
    <button id="langClose" type="button" class="close" title="Close" data-i18n-title="close">×</button>
    <h3 id="langHead" data-i18n="langTitle">Choose language</h3>
    <div id="langList"></div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
