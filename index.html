<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valheim Seed-Karte</title>
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="poi-icons/site/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="poi-icons/site/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="poi-icons/site/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>Valheim Seed-Karte</h1>
      <p class="sub">Ganze Welt ohne Nebel – direkt aus dem Seed berechnet</p>
    </header>

    <section>
      <h2>Welt</h2>
      <form id="seedForm" class="row">
        <input id="seedInput" type="text" placeholder="Seed, z. B. Xldpp3L2LG" spellcheck="false" autocomplete="off">
        <button type="submit">Laden</button>
      </form>
      <div class="row">
        <input id="nameInput" type="text" placeholder="Name (optional)" spellcheck="false" autocomplete="off" maxlength="60">
        <button id="btnSave" type="button" title="Seed (und Namen) in diesem Browser speichern">Speichern</button>
      </div>
      <div class="row">
        <div id="saved" class="dropdown">
          <button id="savedBtn" type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"></button>
          <ul id="savedList" class="dd-list" role="listbox" hidden></ul>
        </div>
        <button id="btnExample" type="button" title="Beispiel-Seed Xldpp3L2LG laden">Beispielwelt</button>
      </div>
      <p id="worldInfo" class="info"></p>
    </section>

    <section class="grow">
      <h2>Orte (POIs) <span id="poiTotal" class="muted"></span></h2>
      <div class="row">
        <input id="search" type="search" placeholder="Suchen, z. B. Händler, Krypta…">
      </div>
      <div class="row small">
        <button id="btnAll" type="button">Alle</button>
        <button id="btnNone" type="button">Keine</button>
        <label><input id="chkLabels" type="checkbox" checked> Namen</label>
      </div>
      <div id="cats"></div>
      <p id="poiHint" class="info"></p>
    </section>

    <footer>
      Ziehen = verschieben · Mausrad = zoomen · Klick auf einen Namen in der Liste springt zum nächsten Ort
    </footer>
  </aside>

  <main id="mapWrap">
    <canvas id="map"></canvas>
    <div id="tooltip" hidden></div>
    <div id="popup" hidden></div>
    <div id="progress" role="progressbar" aria-label="Orte werden berechnet" aria-valuemin="0" aria-valuemax="100" hidden>
      <div class="progress-head"><span>Orte werden berechnet …</span><span id="progressText">0 %</span></div>
      <div class="progress-track"><div id="progressBar"></div></div>
    </div>
    <div id="zoomBtns">
      <button id="zoomIn" type="button" title="Hineinzoomen">+</button>
      <button id="zoomOut" type="button" title="Herauszoomen">−</button>
      <button id="zoomHome" type="button" title="Ganze Welt">⌂</button>
    </div>
    <div id="status">
      <span id="stPos">–</span>
      <span id="stBiome"></span>
      <span id="stScale"></span>
      <span id="stLoad"></span>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
