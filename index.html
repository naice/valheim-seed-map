  <script>
    // Stammseite = Englisch. Wer eine andere Sprache gewählt hat (oder dessen Browser eine andere bevorzugt), wird weitergeleitet.
    (function () {
      var known = ["en","de","fr","it","pt","es","no","sv","nl"], c = null;
      try { c = localStorage.getItem('valheim-map.lang'); } catch (e) {}
      if (known.indexOf(c) < 0) {
        c = null;
        var list = navigator.languages || [navigator.language || ''];
        for (var i = 0; i < list.length && !c; i++) {
          var x = String(list[i]).toLowerCase().split('-')[0];
          if (x === 'nb' || x === 'nn') x = 'no';
          if (known.indexOf(x) >= 0) c = x;
        }
      }
      if (c && c !== 'en') location.replace(c + '/' + location.hash);
    })();
  </script>

<body class="map-page">
  <header class="site-head">
    <h1><a class="brand" href="./"><img src="./poi-icons/site/favicon-32.png" alt="" width="24" height="24"> Valheim-Map</a></h1>
    <nav>
        <a href="./" aria-current="page">Map</a>
        <a href="./seeds/">Best seeds</a>
        <a href="./bosses/">Bosses</a>
        <a href="./traders/">Traders</a>
        <a href="./faq/">FAQ</a>
    </nav>
    <div class="tools"><a id="btnDonate" class="tool" href="https://ko-fi.com/emmuss" target="_blank" rel="noopener" title="Support the project on Ko-fi"><span class="heart">♥</span> Donate</a><button id="btnLang" class="tool" type="button" title="Choose language" aria-haspopup="dialog">🌐 English</button></div>
  </header>
  <div id="app">
    <aside id="sidebar">

      <section>
        <h2>World</h2>
        <form id="seedForm" class="row">
          <input id="seedInput" type="text" placeholder="Seed, e.g. Xldpp3L2LG" spellcheck="false" autocomplete="off">
          <button type="submit">Load</button>
        </form>
        <div class="row">
          <input id="nameInput" type="text" placeholder="Name (optional)" spellcheck="false" autocomplete="off" maxlength="60">
          <button id="btnSave" type="button" title="Save the seed (and name) in this browser">Save</button>
        </div>
        <div class="row">
          <div id="saved" class="dropdown">
            <button id="savedBtn" type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"></button>
            <ul id="savedList" class="dd-list" role="listbox" hidden></ul>
          </div>
          <button id="btnExample" type="button" title="Load the example seed Xldpp3L2LG">Example world</button>
        </div>
        <p id="worldInfo" class="info"></p>
      </section>

      <section class="grow">
        <h2>Locations (POIs) <span id="poiTotal" class="muted"></span></h2>
        <div class="row">
          <input id="search" type="search" placeholder="Search, e.g. trader, crypt…">
        </div>
        <div class="row small">
          <button id="btnAll" type="button">All</button>
          <button id="btnNone" type="button">None</button>
          <label><input id="chkLabels" type="checkbox" checked> Names</label>
        </div>
        <div id="cats"></div>
        <p id="poiHint" class="info"></p>
      </section>

      <footer>
        <span>Drag = pan · Mouse wheel = zoom · Click a name in the list to jump to the nearest location</span>
      </footer>
    </aside>

    <main id="mapWrap">
      <canvas id="map"></canvas>
      <div id="tooltip" hidden></div>
      <div id="popup" hidden></div>
      <div id="progress" role="progressbar" aria-label="Computing locations …" aria-valuemin="0" aria-valuemax="100" hidden>
        <div class="progress-head"><span>Computing locations …</span><span id="progressText">0 %</span></div>
        <div class="progress-track"><div id="progressBar"></div></div>
      </div>
      <div id="zoomBtns">
        <button id="zoomIn" type="button" title="Zoom in">+</button>
        <button id="zoomOut" type="button" title="Zoom out">−</button>
        <button id="zoomHome" type="button" title="Whole world">⌂</button>
      </div>
      <div id="status">
        <span id="stPos">–</span>
        <span id="stBiome"></span>
        <span id="stScale"></span>
        <span id="stLoad"></span>
      </div>
    </main>
  </div>

  <noscript><p class="noscript">The interactive map needs JavaScript. The guides for seeds, bosses and traders work without it.</p></noscript>

  <dialog id="langDlg" aria-labelledby="langHead">
    <button id="langClose" type="button" class="close" title="Close">×</button>
    <h3 id="langHead">Choose language</h3>
    <div id="langList"></div>
  </dialog>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
