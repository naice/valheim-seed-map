<body class="map-page">
  <header class="site-head">
    <h1><a class="brand" href="../nl/"><img src="../poi-icons/site/favicon-32.png" alt="" width="24" height="24"> Valheim-Map</a></h1>
    <nav>
        <a href="../nl/" aria-current="page">Kaart</a>
        <a href="../nl/seeds/">Beste seeds</a>
        <a href="../nl/bosses/">Bazen</a>
        <a href="../nl/traders/">Handelaren</a>
        <a href="../nl/faq/">FAQ</a>
    </nav>
    <div class="tools"><a id="btnDonate" class="tool" href="https://ko-fi.com/emmuss" target="_blank" rel="noopener" title="Steun het project op Ko-fi"><span class="heart">♥</span> Doneren</a><button id="btnLang" class="tool" type="button" title="Taal kiezen" aria-haspopup="dialog">🌐 Nederlands</button></div>
  </header>
  <div id="app">
    <aside id="sidebar">

      <section>
        <h2>Wereld</h2>
        <form id="seedForm" class="row">
          <input id="seedInput" type="text" placeholder="Seed, bijv. Xldpp3L2LG" spellcheck="false" autocomplete="off">
          <button type="submit">Laden</button>
        </form>
        <div class="row">
          <input id="nameInput" type="text" placeholder="Naam (optioneel)" spellcheck="false" autocomplete="off" maxlength="60">
          <button id="btnSave" type="button" title="Seed (en naam) in deze browser opslaan">Opslaan</button>
        </div>
        <div class="row">
          <div id="saved" class="dropdown">
            <button id="savedBtn" type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"></button>
            <ul id="savedList" class="dd-list" role="listbox" hidden></ul>
          </div>
          <button id="btnExample" type="button" title="Voorbeeld-seed Xldpp3L2LG laden">Voorbeeldwereld</button>
        </div>
        <p id="worldInfo" class="info"></p>
      </section>

      <section class="grow">
        <h2>Locaties (POI’s) <span id="poiTotal" class="muted"></span></h2>
        <div class="row">
          <input id="search" type="search" placeholder="Zoeken, bijv. handelaar, crypte…">
        </div>
        <div class="row small">
          <button id="btnAll" type="button">Alle</button>
          <button id="btnNone" type="button">Geen</button>
          <label><input id="chkLabels" type="checkbox" checked> Namen</label>
        </div>
        <div id="cats"></div>
        <p id="poiHint" class="info"></p>
      </section>

      <footer>
        <span>Slepen = verplaatsen · Muiswiel = zoomen · Klik op een naam in de lijst om naar de dichtstbijzijnde locatie te springen</span>
      </footer>
    </aside>

    <main id="mapWrap">
      <canvas id="map"></canvas>
      <div id="tooltip" hidden></div>
      <div id="popup" hidden></div>
      <div id="progress" role="progressbar" aria-label="Locaties worden berekend …" aria-valuemin="0" aria-valuemax="100" hidden>
        <div class="progress-head"><span>Locaties worden berekend …</span><span id="progressText">0 %</span></div>
        <div class="progress-track"><div id="progressBar"></div></div>
      </div>
      <div id="zoomBtns">
        <button id="zoomIn" type="button" title="Inzoomen">+</button>
        <button id="zoomOut" type="button" title="Uitzoomen">−</button>
        <button id="zoomHome" type="button" title="Hele wereld">⌂</button>
      </div>
      <div id="status">
        <span id="stPos">–</span>
        <span id="stBiome"></span>
        <span id="stScale"></span>
        <span id="stLoad"></span>
      </div>
    </main>
  </div>

  <noscript><p class="noscript">De interactieve kaart heeft JavaScript nodig. De gidsen over seeds, bazen en handelaren werken ook zonder.</p></noscript>

  <dialog id="langDlg" aria-labelledby="langHead">
    <button id="langClose" type="button" class="close" title="Sluiten">×</button>
    <h3 id="langHead">Taal kiezen</h3>
    <div id="langList"></div>
  </dialog>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
