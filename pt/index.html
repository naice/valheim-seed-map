<body class="map-page">
  <header class="site-head">
    <h1><a class="brand" href="../pt/"><img src="../poi-icons/site/favicon-32.png" alt="" width="24" height="24"> Valheim-Map</a></h1>
    <nav>
        <a href="../pt/" aria-current="page">Mapa</a>
        <a href="../pt/seeds/">Melhores sementes</a>
        <a href="../pt/bosses/">Chefes</a>
        <a href="../pt/traders/">Comerciantes</a>
        <a href="../pt/faq/">FAQ</a>
    </nav>
    <div class="tools"><a id="btnDonate" class="tool" href="https://ko-fi.com/emmuss" target="_blank" rel="noopener" title="Apoiar o projeto no Ko-fi"><span class="heart">♥</span> Doar</a><button id="btnLang" class="tool" type="button" title="Escolher idioma" aria-haspopup="dialog">🌐 Português</button></div>
  </header>
  <div id="app">
    <aside id="sidebar">

      <section>
        <h2>Mundo</h2>
        <form id="seedForm" class="row">
          <input id="seedInput" type="text" placeholder="Seed, p. ex. Xldpp3L2LG" spellcheck="false" autocomplete="off">
          <button type="submit">Carregar</button>
        </form>
        <div class="row">
          <input id="nameInput" type="text" placeholder="Nome (opcional)" spellcheck="false" autocomplete="off" maxlength="60">
          <button id="btnSave" type="button" title="Guardar a seed (e o nome) neste navegador">Guardar</button>
        </div>
        <div class="row">
          <div id="saved" class="dropdown">
            <button id="savedBtn" type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"></button>
            <ul id="savedList" class="dd-list" role="listbox" hidden></ul>
          </div>
          <button id="btnExample" type="button" title="Carregar a seed de exemplo Xldpp3L2LG">Mundo de exemplo</button>
        </div>
        <p id="worldInfo" class="info"></p>
      </section>

      <section class="grow">
        <h2>Locais (POIs) <span id="poiTotal" class="muted"></span></h2>
        <div class="row">
          <input id="search" type="search" placeholder="Procurar, p. ex. mercador, cripta…">
        </div>
        <div class="row small">
          <button id="btnAll" type="button">Todos</button>
          <button id="btnNone" type="button">Nenhum</button>
          <label><input id="chkLabels" type="checkbox" checked> Nomes</label>
        </div>
        <div id="cats"></div>
        <p id="poiHint" class="info"></p>
      </section>

      <footer>
        <span>Arrastar = mover · Roda do rato = zoom · Clicar num nome da lista salta para o local mais próximo</span>
      </footer>
    </aside>

    <main id="mapWrap">
      <canvas id="map"></canvas>
      <div id="tooltip" hidden></div>
      <div id="popup" hidden></div>
      <div id="progress" role="progressbar" aria-label="A calcular os locais …" aria-valuemin="0" aria-valuemax="100" hidden>
        <div class="progress-head"><span>A calcular os locais …</span><span id="progressText">0 %</span></div>
        <div class="progress-track"><div id="progressBar"></div></div>
      </div>
      <div id="zoomBtns">
        <button id="zoomIn" type="button" title="Aproximar">+</button>
        <button id="zoomOut" type="button" title="Afastar">−</button>
        <button id="zoomHome" type="button" title="Mundo inteiro">⌂</button>
      </div>
      <div id="status">
        <span id="stPos">–</span>
        <span id="stBiome"></span>
        <span id="stScale"></span>
        <span id="stLoad"></span>
      </div>
    </main>
  </div>

  <noscript><p class="noscript">O mapa interativo precisa de JavaScript. Os guias de sementes, chefes e comerciantes funcionam sem ele.</p></noscript>

  <dialog id="langDlg" aria-labelledby="langHead">
    <button id="langClose" type="button" class="close" title="Fechar">×</button>
    <h3 id="langHead">Escolher idioma</h3>
    <div id="langList"></div>
  </dialog>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
