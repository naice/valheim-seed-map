<body class="map-page">
  <header class="site-head">
    <h1><a class="brand" href="../fr/"><img src="../poi-icons/site/favicon-32.png" alt="" width="24" height="24"> Valheim-Map</a></h1>
    <nav>
        <a href="../fr/" aria-current="page">Carte</a>
        <a href="../fr/seeds/">Meilleures seeds</a>
        <a href="../fr/bosses/">Boss</a>
        <a href="../fr/traders/">Marchands</a>
        <a href="../fr/faq/">FAQ</a>
    </nav>
    <div class="tools"><a id="btnDonate" class="tool" href="https://ko-fi.com/emmuss" target="_blank" rel="noopener" title="Soutenir le projet sur Ko-fi"><span class="heart">♥</span> Faire un don</a><button id="btnLang" class="tool" type="button" title="Choisir la langue" aria-haspopup="dialog">🌐 Français</button></div>
  </header>
  <div id="app">
    <aside id="sidebar">

      <section>
        <h2>Monde</h2>
        <form id="seedForm" class="row">
          <input id="seedInput" type="text" placeholder="Seed, p. ex. Xldpp3L2LG" spellcheck="false" autocomplete="off">
          <button type="submit">Charger</button>
        </form>
        <div class="row">
          <input id="nameInput" type="text" placeholder="Nom (facultatif)" spellcheck="false" autocomplete="off" maxlength="60">
          <button id="btnSave" type="button" title="Enregistrer le seed (et le nom) dans ce navigateur">Enregistrer</button>
        </div>
        <div class="row">
          <div id="saved" class="dropdown">
            <button id="savedBtn" type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"></button>
            <ul id="savedList" class="dd-list" role="listbox" hidden></ul>
          </div>
          <button id="btnExample" type="button" title="Charger le seed d’exemple Xldpp3L2LG">Monde d’exemple</button>
        </div>
        <p id="worldInfo" class="info"></p>
      </section>

      <section class="grow">
        <h2>Lieux (POI) <span id="poiTotal" class="muted"></span></h2>
        <div class="row">
          <input id="search" type="search" placeholder="Rechercher, p. ex. marchand, crypte…">
        </div>
        <div class="row small">
          <button id="btnAll" type="button">Tous</button>
          <button id="btnNone" type="button">Aucun</button>
          <label><input id="chkLabels" type="checkbox" checked> Noms</label>
        </div>
        <div id="cats"></div>
        <p id="poiHint" class="info"></p>
      </section>

      <footer>
        <span>Glisser = déplacer · Molette = zoomer · Cliquer sur un nom de la liste pour aller au lieu le plus proche</span>
      </footer>
    </aside>

    <main id="mapWrap">
      <canvas id="map"></canvas>
      <div id="tooltip" hidden></div>
      <div id="popup" hidden></div>
      <div id="progress" role="progressbar" aria-label="Calcul des lieux …" aria-valuemin="0" aria-valuemax="100" hidden>
        <div class="progress-head"><span>Calcul des lieux …</span><span id="progressText">0 %</span></div>
        <div class="progress-track"><div id="progressBar"></div></div>
      </div>
      <div id="zoomBtns">
        <button id="zoomIn" type="button" title="Zoom avant">+</button>
        <button id="zoomOut" type="button" title="Zoom arrière">−</button>
        <button id="zoomHome" type="button" title="Monde entier">⌂</button>
      </div>
      <div id="status">
        <span id="stPos">–</span>
        <span id="stBiome"></span>
        <span id="stScale"></span>
        <span id="stLoad"></span>
      </div>
    </main>
  </div>

  <noscript><p class="noscript">La carte interactive a besoin de JavaScript. Les guides sur les seeds, les boss et les marchands fonctionnent sans.</p></noscript>

  <dialog id="langDlg" aria-labelledby="langHead">
    <button id="langClose" type="button" class="close" title="Fermer">×</button>
    <h3 id="langHead">Choisir la langue</h3>
    <div id="langList"></div>
  </dialog>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
